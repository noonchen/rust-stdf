[package]
name = "rust-stdf-derive"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Internal derive macros for the rust-stdf crate (STDF record codec + zero-copy views)."
repository = "https://github.com/noonchen/rust-stdf"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
